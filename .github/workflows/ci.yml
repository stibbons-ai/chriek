name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Duplicate code
        run: uv run --locked pre-commit run jscpd --all-files
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: Dependency audit
        run: uv run --locked python scripts/audit_dependencies.py

  # The same test suite against a real Postgres server; tests marked `sqlite` stay on SQLite.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: chriek-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CHRIEK_TEST_POSTGRES_URL: postgresql://postgres:chriek-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  # The same test suite with images in a real S3-compatible service (RustFS: MinIO no longer
  # publishes container images); tests marked `local_storage` keep local images.
  s3:
    runs-on: ubuntu-latest
    services:
      s3:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: chriek-ci
          RUSTFS_SECRET_KEY: chriek-ci-secret-0123456789
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CHRIEK_TEST_S3_URL: http://chriek-ci:chriek-ci-secret-0123456789@127.0.0.1:9000/chriek-test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # Fails instead of silently testing local storage when the service URL is missing.
      - run: |
          : "${CHRIEK_TEST_S3_URL:?must name the S3 test service}"
          uv run pytest

  # The serverless roles need both shared services; the jobs above each provide only one.
  serverless:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: chriek-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
      s3:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: chriek-ci
          RUSTFS_SECRET_KEY: chriek-ci-secret-0123456789
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      CHRIEK_TEST_POSTGRES_URL: postgresql://postgres:chriek-ci@127.0.0.1:5432/postgres
      CHRIEK_TEST_S3_URL: http://chriek-ci:chriek-ci-secret-0123456789@127.0.0.1:9000/chriek-test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # Fails instead of skipping the walkthroughs when either service URL is missing.
      - run: |
          : "${CHRIEK_TEST_POSTGRES_URL:?must name the Postgres test service}"
          : "${CHRIEK_TEST_S3_URL:?must name the S3 test service}"
          uv run pytest tests/test_serverless.py
